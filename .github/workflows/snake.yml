name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Yedidia-3
          outputs: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v3
        if: false
        with:
          target_branch: output
          build_dir: dist

      - name: push to output branch
        run: |
          cd dist
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b output
          git add -A
          git commit -m "generate snake"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Yedidia-3/Yedidia-3.git output
